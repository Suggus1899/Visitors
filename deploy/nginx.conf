pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map $uri $log_uri {
        default $uri;
        ~^/api/v1/(visitors|privacy/subjects|visits|backups|superadmin/users)/[^/]+ /api/v1/$1/[redacted];
    }
    log_format main escape=json 'client=$remote_addr [$time_iso8601] "$request_method $log_uri $server_protocol" status=$status bytes=$body_bytes_sent request_id=$request_id';
    access_log /dev/stdout main;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    include /etc/nginx/conf.d/*.conf;
}
