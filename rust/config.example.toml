# LogMaster — config.toml (junto a logmaster.exe, p. ej. C:\LogMaster)
# Los secretos NO van aquí: van por entorno o en el archivo de secretos (DPAPI).
#
# Este archivo es el EJEMPLO que lleva el repo (rust/config.example.toml).
# El ejecutable, al arrancar, usa el config.toml junto al .exe si existe y,
# si no existe, crea uno a partir de este ejemplo. Las actualizaciones
# nunca pisan tu config.toml: el repo solo lleva el ejemplo.
# Las variables de entorno tienen prioridad sobre este archivo.
# Diferencias con este ejemplo que impone la implementación real: ver
# rust/README.md, sección «Doble motor por configuración».

[server]
bind = "127.0.0.1"   # solo esta máquina; "0.0.0.0" si otros equipos entran por red
port = 8443
app_url = "https://localhost:8443"
tls = true           # HTTPS con rustls; certificado autofirmado si no hay propio
# tls_dir = "C:\\ProgramData\\LogMaster\\tls"   # donde vive/genera el certificado
# tls_cert = "C:\\ProgramData\\LogMaster\\tls\\cert.pem"  # con tls_key, usa el propio
# tls_key = "C:\\ProgramData\\LogMaster\\tls\\key.pem"

[database]
engine = "sqlite"    # "sqlite" | "postgres"
path = "C:\\ProgramData\\LogMaster\\data\\logmaster.db"  # solo SQLite
# url = "postgres://logmaster_runtime:TU_CLAVE@127.0.0.1:5432/logmaster"  # solo PostgreSQL
test_on_startup = true  # valida la conexión al arrancar; resultado en el log y en /health

[session]
access_minutes = 15
refresh_days = 7

[security]
# jwt_secret, jwt_refresh_secret, encryption_key y edit_password:
# por entorno o archivo de secretos (DPAPI), nunca en este archivo.
# secrets_dir = "C:\\ProgramData\\LogMaster\\secrets"  # archivo de secretos (DPAPI en Windows)

[mail]
host = "127.0.0.1"
port = 1025          # Mailpit en laboratorio; el SMTP real en producción
tls_mode = "local"   # "local" (sin TLS, solo bucle local) | "starttls" | "implicit"
# from = "logmaster@ejemplo.local"
# user = "usuario-smtp"   # SMTP_USER/SMTP_PASSWORD solo por entorno, nunca aquí

[retention]
enabled = false      # desactivada por defecto, como hoy; la ejecuta el programador interno
run_at = "02:00"      # hora de Caracas
data_days = 60
audit_days = 365

[backup]
path = "C:\\ProgramData\\LogMaster\\backups"
keep = 30            # pares verificados que se conservan; manuales e incompletos se preservan
daily_at = "01:00"   # hora de Caracas del respaldo diario
# passwords_path = "C:\\ProgramData\\LogMaster\\backups-passwords"  # contraseñas cifradas, carpeta aparte

[install]
folder = "C:\\LogMaster"
desktop_shortcut = true
