[workspace]
members = ["crates/app", "crates/crypto", "crates/store"]
resolver = "2"

[workspace.dependencies]
aes = "0.8"
aes-gcm = "0.10"
age = "0.12"
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
axum-server = { version = "0.9", features = ["tls-rustls"] }
base64 = "0.22"
bcrypt = "0.17"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
fallible-iterator = "0.2"
futures-util = "0.3"
hex = "0.4"
hmac = "0.13"
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
jsonwebtoken = "9"
leptos = { version = "0.8", default-features = false, features = ["ssr"] }
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "rustls-tls",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
] }
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
printpdf = "0.8"
rand = "0.8"
rcgen = "0.14"
rust_xlsxwriter = "0.102"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging", "std"] }
rustls-pemfile = "2"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
rusqlite_migration = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
# Un solo binario: sin simbolos de depuracion en release.
strip = true
