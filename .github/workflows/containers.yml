name: Containers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Generate private fictitious configuration
        run: sh scripts/containers/configure.sh
      - name: Build, prepare, verify HTTPS and persistence
        run: sh scripts/containers/smoke.sh
      - uses: pnpm/action-setup@v4
        with: {version: 12.4.2}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - name: Browser journey against real containers
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          docker compose -f compose.yaml -f deploy/compose.test.yaml --profile test up -d mailpit
          pnpm exec playwright test
          spoofed=$(docker compose exec -T postgres psql -U logmaster_pilot -d logmaster_pilot -Atc "SELECT count(*) FROM \"ActivityLogs\" WHERE \"ipAddress\"='198.51.100.11'")
          test "$spoofed" = 0
      - name: Sanitized service status
        if: always()
        run: docker compose --profile test ps
      - name: Startup diagnostics
        if: failure()
        run: docker compose --profile test logs --tail 25 api web
      - name: Remove only this job's disposable volumes
        if: always()
        run: docker compose --profile test down --volumes
