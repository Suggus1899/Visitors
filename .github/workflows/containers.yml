name: Containers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Generate private fictitious configuration
        run: sh deploy/scripts/configure.sh
      - name: Build, prepare, verify HTTPS and persistence
        run: sh deploy/scripts/smoke.sh
      - name: Execute the daily and weekly timers ahead of schedule
        run: sh deploy/scripts/timers-ci.sh
      - name: Adopt an independent legacy schema and bootstrap its first root
        run: sh deploy/scripts/adoption-ci.sh
      - uses: pnpm/action-setup@v4
        with: {version: 12.4.2}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - name: Browser journey against real containers
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          docker compose -f compose.yaml -f deploy/compose.test.yaml --profile test up -d mailpit
          pnpm exec playwright test
          spoofed=$(docker compose exec -T postgres psql -U logmaster_pilot -d logmaster_pilot -Atc "SELECT count(*) FROM \"ActivityLogs\" WHERE \"ipAddress\"='198.51.100.11'")
          test "$spoofed" = 0
      - name: Sanitized service status
        if: always()
        run: docker compose --profile test ps
      - name: Export verified application images
        run: |
          mkdir -p .local/images
          docker save logmaster-api:local logmaster-web:local | gzip > .local/images/logmaster-images.tar.gz
      - uses: actions/upload-artifact@v4
        with: {name: logmaster-images, path: .local/images/logmaster-images.tar.gz, retention-days: 7}
      - name: Startup diagnostics
        if: failure()
        run: docker compose --profile test logs --tail 25 api web
      - name: Remove only this job's disposable volumes
        if: always()
        run: docker compose --profile test down --volumes
  small-load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sh deploy/scripts/configure.sh
      - name: Small concurrent laboratory regression
        run: |
          docker compose -f compose.yaml -f deploy/compose.load.yaml --profile load build api
          docker compose -f compose.yaml -f deploy/compose.load.yaml up -d --wait postgres
          docker compose -f compose.yaml -f deploy/compose.load.yaml --profile load run --rm lab generate --visitors 100 --visits 1000
          docker compose -f compose.yaml -f deploy/compose.load.yaml up -d --wait api
          docker compose -f compose.yaml -f deploy/compose.load.yaml --profile load run --rm lab load --warmup 5s --duration 30s
      - if: always()
        run: docker compose -f compose.yaml -f deploy/compose.load.yaml --profile load down -v
