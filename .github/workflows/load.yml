name: Full laboratory load
on: {workflow_dispatch: {}}
permissions: {contents: read}
concurrency: {group: logmaster-full-load, cancel-in-progress: false}
jobs:
  laboratory:
    runs-on: [self-hosted, linux, x64, logmaster-load]
    timeout-minutes: 60
    defaults: {run: {shell: bash}}
    steps:
      - uses: actions/checkout@v4
      - name: Check capacity and allocate unique laboratory resources
        run: |
          cpus=$(nproc)
          memory_kib=$(awk '/MemTotal:/ {print $2}' /proc/meminfo)
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          workspace_free=$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          docker_free=$(df -PB1 "$docker_root" | awk 'NR==2 {print $4}')
          required_disk=549755813888
          if [ "$cpus" -lt 4 ] || [ "$memory_kib" -lt 16777216 ] || [ "$workspace_free" -lt "$required_disk" ] || [ "$docker_free" -lt "$required_disk" ]; then
            echo "Insufficient lab capacity: cpus=$cpus memory_kib=$memory_kib workspace_free=$workspace_free docker_free=$docker_free" >&2
            exit 1
          fi
          config_dir="$RUNNER_TEMP/logmaster-config-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          results_dir="$RUNNER_TEMP/logmaster-results-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "LOGMASTER_CONFIG_DIR=$config_dir" >> "$GITHUB_ENV"
          echo "LOGMASTER_RESULTS=$results_dir" >> "$GITHUB_ENV"
          echo "COMPOSE_PROJECT_NAME=logmaster-load-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          mkdir -p "$results_dir"
          { lscpu; free -m; df -h "$RUNNER_TEMP"; df -h "$docker_root"; docker version; docker info; } > "$results_dir/hardware.txt"
      - name: Prepare isolated fictitious configuration
        run: sh deploy/scripts/configure.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum
      - name: Verify authenticated streaming with a 2 GiB fixture
        working-directory: server-go
        run: |
          export TMPDIR="$RUNNER_TEMP"
          LOGMASTER_LARGE_BACKUP_TEST=true LOGMASTER_DB_TEST=false go test -race -v -timeout 30m ./internal/backup -run '^TestMultiGiBArchiveStreaming$' -count=1 | tee "$LOGMASTER_RESULTS/backup-stream-2gib.log"
      - uses: pnpm/action-setup@v4
        with: {version: 12.4.2}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - name: Install browser test tooling
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Build the complete HTTPS application and generate 100000 visitors and 1000000 visits
        run: |
          docker compose -f compose.yaml -f deploy/compose.load.yaml --profile load --profile test build api frontend web
          docker compose -f compose.yaml -f deploy/compose.load.yaml --profile load --profile test up -d --wait postgres mailpit
          docker compose -f compose.yaml -f deploy/compose.load.yaml --profile load run --rm lab generate --open-visits 5000 | tee "$LOGMASTER_RESULTS/generation.json"
          docker compose -f compose.yaml -f deploy/compose.load.yaml --profile load --profile test up -d --wait api frontend web
      - name: Two minutes warmup and fifteen minutes of full-stack load plus five browsers
        run: |
          (while true; do date -u; docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}} {{.BlockIO}}'; sleep 15; done) > "$LOGMASTER_RESULTS/resources.txt" &
          monitor=$!
          browser_pid=
          cleanup() {
            kill "$monitor" 2>/dev/null || true
            if [ -n "$browser_pid" ]; then kill "$browser_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          LOGMASTER_BROWSER_LOAD=true pnpm exec playwright test tests/browser/load.spec.ts --workers=1 > "$LOGMASTER_RESULTS/browser.log" 2>&1 &
          browser_pid=$!
          docker compose -f compose.yaml -f deploy/compose.load.yaml --profile load run --rm lab load --url https://web:8443 --warmup 2m --duration 15m | tee "$LOGMASTER_RESULTS/load.json"
          wait "$browser_pid"
      - name: Verify large backup and isolated restoration
        run: |
          (while true; do date -u; docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}} {{.BlockIO}}'; sleep 2; done) > "$LOGMASTER_RESULTS/backup-resources.txt" &
          backup_monitor=$!
          trap 'kill "$backup_monitor" || true' EXIT
          docker compose -f compose.yaml -f deploy/compose.load.yaml up -d --wait postgres-restore
          docker compose -f compose.yaml -f deploy/compose.load.yaml run --rm backup backup-daily | tee "$LOGMASTER_RESULTS/backup.json"
          docker compose -f compose.yaml -f deploy/compose.load.yaml run --rm ops rehearse
          docker compose -f compose.yaml -f deploy/compose.load.yaml run --rm ops backup-status | tee "$LOGMASTER_RESULTS/status.json"
      - name: Collect sanitized startup diagnostics
        if: failure() && env.LOGMASTER_CONFIG_DIR != ''
        run: |
          docker compose -f compose.yaml -f deploy/compose.load.yaml --profile load --profile ops --profile test ps > "$LOGMASTER_RESULTS/services.txt"
          docker compose -f compose.yaml -f deploy/compose.load.yaml --profile load --profile ops --profile test logs --no-color --tail 80 api frontend web > "$LOGMASTER_RESULTS/services.log"
      - uses: actions/upload-artifact@v4
        if: always() && env.LOGMASTER_RESULTS != ''
        with:
          name: fictitious-load-results
          path: ${{ env.LOGMASTER_RESULTS }}
          retention-days: 7
      - name: Dispose only this runner's laboratory volumes
        if: always()
        run: |
          expected_project="logmaster-load-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ "${COMPOSE_PROJECT_NAME:-}" = "$expected_project" ]; then
            docker compose -f compose.yaml -f deploy/compose.load.yaml --profile load --profile ops --profile test down --volumes --remove-orphans
          fi
      - name: Remove this run's private configuration
        if: always()
        run: |
          case "${LOGMASTER_CONFIG_DIR:-}" in
            "$RUNNER_TEMP"/logmaster-config-*) rm -rf -- "$LOGMASTER_CONFIG_DIR" ;;
          esac
